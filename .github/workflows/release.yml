name: Release

# Fires only on a version tag you push, never on an ordinary commit — releases
# stay a deliberate act. Cutting one is:
#
#   npm version patch      # bumps package.json and creates the tag
#   git push --follow-tags
#
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    # Windows is not optional: the NSIS target needs a Windows runner.
    runs-on: windows-latest

    permissions:
      # electron-builder creates the release and uploads the installer.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json produces a release whose assets
      # are named for one version and whose update feed advertises another.
      - name: Check the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "releasing $pkg"

      - run: npm test

      # `dist`, not `release` — `--publish never`, so electron-builder builds the
      # installer, the blockmap and the update feed but uploads nothing.
      #
      # It used to publish directly. Its uploads run concurrently and each one
      # does a find-or-create for "the release at this tag"; a draft has no real
      # git tag until it is published, so GitHub happily allows several sharing
      # a name and neither uploader found the other's. Every release since 0.3.0
      # came out as two drafts with the assets split across them, and the one
      # holding the blockmap was always the one deleted by hand — which is why
      # no release has ever shipped one, and why differential updates have never
      # actually worked.
      - run: npm run dist

      # One call, three assets, so there is nothing to race. `gh` is preinstalled
      # on GitHub-hosted runners, which keeps this off a third-party action.
      #
      # Still a draft: drafts are invisible to electron-updater, so publishing
      # stays a deliberate human step.
      - name: Upload the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            release/movie-app-*-setup.exe
            release/movie-app-*-setup.exe.blockmap
            release/latest.yml
          )

          # A re-run of the same tag adds to the draft that is already there
          # rather than failing on "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" "${assets[@]}"
          fi
